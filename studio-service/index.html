<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Jack Studio 360° sign-in service</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f0e6; color: #401410; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(520px, 100%); padding: 32px; background: #fbf8f0; border: 1px solid rgba(64, 20, 16, 0.16); border-radius: 8px; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    p { margin: 0 0 12px; color: #6b5d45; }
    #state { margin: 18px 0 0; padding: 12px 14px; border-radius: 6px; background: #fff; border: 1px solid rgba(64, 20, 16, 0.16); color: #401410; }
    #state.ok { border-color: #4f7a4b; }
    #state.no { border-color: #a3341f; }
  </style>
</head>
<body>
  <main>
    <h1>Jack Studio 360° sign-in service</h1>
    <p>This address checks the usernames and passwords of the Jack Studio 360° Studio. There is nothing to do here: copy the address from your browser's address bar and paste it in the Studio under <b>Team</b>.</p>
    <p id="state" role="status">Checking…</p>
  </main>
  <script>
    fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
      var el = document.getElementById('state');
      el.className = s.ok ? 'ok' : 'no';
      el.textContent = s.ok ? 'The service is running and set up.' : 'Not ready yet: ' + (s.problem || 'unknown problem');
    }).catch(function () {
      var el = document.getElementById('state');
      el.className = 'no';
      el.textContent = 'The service did not answer. On Vercel, check that the deployment finished and that Root Directory is "studio-service".';
    });
  </script>
</body>
</html>
